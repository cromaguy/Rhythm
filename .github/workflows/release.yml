name: Build Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        uses: android-actions/setup-android@v4

      - name: Create files for signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          mkdir -p config/signing
          mkdir -p .config
          printf '%s' "$SIGNING_KEYSTORE" | base64 -di > ./config/signing/rhythm_keystore.jks
          printf '%s' "$SIGNING_PROPERTIES" | base64 -di > ./.config/keystore.properties
          printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./config/signing/private.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build app (GitHub and F-Droid flavors)
        env:
          APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
        run: ./gradlew assembleGithubRelease assembleFdroidRelease --stacktrace

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/github/release
          for file in Rhythm-*-githubRelease*.apk; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
              md5sum "$file" > "$file.md5"
            fi
          done
          cd $GITHUB_WORKSPACE/app/build/outputs/apk/fdroid/release
          for file in Rhythm-*-fdroidRelease*.apk; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
              md5sum "$file" > "$file.md5"
            fi
          done

      - name: Set prerelease flag
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        run: python scripts/generate_release_notes.py "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Github Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk.sha256
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk.md5
            app/build/outputs/apk/fdroid/release/Rhythm-*-fdroidRelease*.apk
            app/build/outputs/apk/fdroid/release/Rhythm-*-fdroidRelease*.apk.sha256
            app/build/outputs/apk/fdroid/release/Rhythm-*-fdroidRelease*.apk.md5

      # ── Notifications ────────────────────────────────────────────────────────

      - name: Locate universal Release APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/github/release -name "Rhythm-*-githubRelease.apk" ! -name "*-arm64-v8a.apk" ! -name "*-armeabi-v7a.apk" ! -name "*-x86_64.apk" ! -name "*-x86.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found — skipping notifications."
            echo "path=" >> $GITHUB_OUTPUT
          else
            cp "$APK_PATH" /tmp/rhythm-release.apk
            echo "path=/tmp/rhythm-release.apk" >> $GITHUB_OUTPUT
            echo "Found APK: $APK_PATH"
          fi

      - name: Send Release APK to Telegram
        if: >
          success() &&
          steps.find_apk.outputs.path != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set — skipping."
            exit 0
          fi
          IS_BETA="${{ steps.prerelease.outputs.value }}"
          if [ "$IS_BETA" = "true" ]; then
            BADGE="🔶 <b>Rhythm Beta Release</b>"
          else
            BADGE="✅ <b>Rhythm Stable Release</b>"
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          CAPTION="${BADGE}"
          CAPTION+=$'\n\n'
          CAPTION+="🏷️ <b>Tag:</b> <code>${{ github.ref_name }}</code>"
          CAPTION+=$'\n'
          CAPTION+="📅 <b>Date:</b> <code>$(date +%Y-%m-%d)</code>"
          CAPTION+=$'\n\n'
          CAPTION+="<a href=\"${RELEASE_URL}\">📥 View Full Release & Changelog</a>"
          if [ ! -f "${{ steps.find_apk.outputs.path }}" ]; then
            echo "❌ APK file not found at ${{ steps.find_apk.outputs.path }}"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/tg_response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${{ steps.find_apk.outputs.path }}" \
            --form-string "caption=${CAPTION}" \
            --form-string "parse_mode=HTML")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] && grep -q '"ok":true' /tmp/tg_response.json 2>/dev/null; then
            echo "✅ Telegram notification sent."
          else
            echo "❌ Telegram notification failed:"
            cat /tmp/tg_response.json 2>/dev/null || echo "(empty response)"
            exit 1
          fi

      - name: Send Release notification to Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ Discord webhook URL not set — skipping."
            exit 0
          fi
          IS_BETA="${{ steps.prerelease.outputs.value }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          RELEASE_DATE="$(date +%Y-%m-%d)"

          if [ "$IS_BETA" = "true" ]; then
            EMBED_COLOR=16744272   # orange #FF8010
            EMBED_TITLE="🔶 Rhythm Beta Release"
            EMBED_DESC="A new **beta release** of Rhythm is now available on GitHub!"
            NOTE="This is a **beta/pre-release** build. Please report issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues)."
          else
            EMBED_COLOR=5763719    # green #57F287
            EMBED_TITLE="✅ Rhythm Stable Release"
            EMBED_DESC="A new **stable release** of Rhythm is now available — update recommended!"
            NOTE="Turn on **Auto-Backup** in Settings so you can always recover your data."
          fi

          cat > /tmp/discord_payload.json <<EOF
          {
            "username": "Rhythm Releases",
            "avatar_url": "https://github.com/cromaguy/Rhythm/raw/main/assets/icon.png",
            "embeds": [
              {
                "title": "${EMBED_TITLE}",
                "description": "${EMBED_DESC}",
                "url": "${RELEASE_URL}",
                "color": ${EMBED_COLOR},
                "fields": [
                  {
                    "name": "🏷️ Tag",
                    "value": "\`${{ github.ref_name }}\`",
                    "inline": true
                  },
                  {
                    "name": "📅 Date",
                    "value": "${RELEASE_DATE}",
                    "inline": true
                  },
                  {
                    "name": "📥 Download",
                    "value": "[GitHub Release Page](${RELEASE_URL})",
                    "inline": false
                  },
                  {
                    "name": "💡 Tip",
                    "value": "${NOTE}",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Rhythm CI • Release Channel"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF

          curl -s -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d @/tmp/discord_payload.json \
            | tee /tmp/discord_response.json \
            && echo "✅ Discord notification sent." \
            || { echo "❌ Discord notification failed:"; cat /tmp/discord_response.json; exit 1; }
