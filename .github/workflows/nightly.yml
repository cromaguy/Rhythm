name: Build Nightly Artifacts

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper versioning and commit count

      - name: Check if version changed
        id: check_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered via workflow_dispatch. Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          if git rev-parse "$BEFORE_SHA" >/dev/null 2>&1; then
            OLD_NAME=$(git show "$BEFORE_SHA":app/build.gradle.kts 2>/dev/null | grep -E 'versionName\s*=' | grep -oE '"[^"]+"' | sed 's/"//g' || true)
            OLD_CODE=$(git show "$BEFORE_SHA":app/build.gradle.kts 2>/dev/null | grep -E 'versionCode\s*=' | grep -oE '[0-9]+' | head -n 1 || true)

            CURR_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | sed 's/"//g' || true)
            CURR_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1 || true)

            echo "Previous version: name='$OLD_NAME', code='$OLD_CODE'"
            echo "Current version:  name='$CURR_NAME', code='$CURR_CODE'"

            if [ -n "$OLD_NAME" ] && [ -n "$CURR_NAME" ] && [ "$OLD_NAME" = "$CURR_NAME" ] && [ "$OLD_CODE" = "$CURR_CODE" ]; then
              echo "::notice::Version in app/build.gradle.kts has not changed. Skipping nightly build."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Version changed or check skipped. Proceeding with nightly build."
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: set up JDK 17
        if: steps.check_version.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        if: steps.check_version.outputs.should_run == 'true'
        uses: android-actions/setup-android@v3

      - name: Create files for signing
        if: steps.check_version.outputs.should_run == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          mkdir -p config/signing
          mkdir -p .config
          # Decode keystore and signing property files if secrets are available
          if [ -n "$SIGNING_KEYSTORE" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 -di > ./config/signing/rhythm_keystore.jks
          fi
          if [ -n "$SIGNING_PROPERTIES" ]; then
            printf '%s' "$SIGNING_PROPERTIES" | base64 -di > ./.config/keystore.properties
          fi
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./config/signing/private.properties
          else
            touch ./config/signing/private.properties
          fi

      - name: Make Gradle executable
        if: steps.check_version.outputs.should_run == 'true'
        run: chmod +x ./gradlew

      - name: Compute dynamic version info
        if: steps.check_version.outputs.should_run == 'true'
        id: version_info
        run: |
          # Parse current versionName & versionCode from build.gradle.kts
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | sed 's/"//g')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1)
          
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=524211101
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="5.2.421.1101 Beta"
          fi
          
          # Git commit count for increasing version code
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NEW_VERSION_CODE=$((VERSION_CODE + COMMIT_COUNT))
          
          # Extract short commit hash
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Clean version name (remove " Beta" if present)
          VERSION_NAME_CLEANED=$(echo "$VERSION_NAME" | sed 's/ Beta//')
          
          # Construct version name: e.g., 5.2.421.1101-nightly-r42-a1b2c3d
          NEW_VERSION_NAME="${VERSION_NAME_CLEANED}-nightly-r${{ github.run_number }}-${SHORT_SHA}"
          
          echo "code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "Computed Version Code: $NEW_VERSION_CODE"
          echo "Computed Version Name: $NEW_VERSION_NAME"

      - name: Send start notification to Telegram
        if: steps.check_version.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set — skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="⚙️ <b>Rhythm Nightly Build Started</b>"
          MESSAGE+=$'\n\n'
          MESSAGE+="📦 <b>Version:</b> <code>${{ steps.version_info.outputs.name }}</code>"
          MESSAGE+=$'\n'
          MESSAGE+="🔗 <b>Commit:</b> <code>${{ steps.version_info.outputs.short_sha }}</code>"
          MESSAGE+=$'\n\n'
          MESSAGE+="⏳ Build in progress... We will upload the APK upon completion."
          MESSAGE+=$'\n\n'
          MESSAGE+="<a href=\"${RUN_URL}\">🔍 View Actions Run</a>"
          
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}" \
            --form-string "parse_mode=HTML" \
            --form-string "disable_web_page_preview=true"

      - name: Build with Gradle (GitHub and F-Droid release variants)
        if: steps.check_version.outputs.should_run == 'true'
        env:
          APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          ./gradlew assembleGithubRelease assembleFdroidRelease \
            -PversionCodeOverride=${{ steps.version_info.outputs.code }} \
            -PversionNameOverride="${{ steps.version_info.outputs.name }}" \
            -PreleaseDateOverride=$(date +%Y-%m-%d) \
            -Pnightly=true \
            --stacktrace

      - name: Upload Nightly APKs
        if: steps.check_version.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-Nightly-Artifacts
          path: |
            app/build/outputs/apk/github/release/Rhythm-*-githubRelease*.apk
            app/build/outputs/apk/fdroid/release/Rhythm-*-fdroidRelease*.apk
          retention-days: 14

      # ── Notifications ────────────────────────────────────────────────────────

      - name: Locate universal Nightly APK
        if: success() && steps.check_version.outputs.should_run == 'true'
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/github/release -name "Rhythm-*-githubRelease.apk" ! -name "*-arm64-v8a.apk" ! -name "*-armeabi-v7a.apk" ! -name "*-x86_64.apk" ! -name "*-x86.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found — skipping notifications."
            echo "path=" >> $GITHUB_OUTPUT
          else
            cp "$APK_PATH" /tmp/rhythm-nightly.apk
            echo "path=/tmp/rhythm-nightly.apk" >> $GITHUB_OUTPUT
            echo "Found APK: $APK_PATH"
          fi

      - name: Send Nightly APK to Telegram
        if: >
          success() &&
          steps.check_version.outputs.should_run == 'true' &&
          steps.find_apk.outputs.path != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set — skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CAPTION="🎵 <b>Rhythm Nightly Build</b>"
          CAPTION+=$'\n\n'
          CAPTION+="📦 <b>Version:</b> <code>${{ steps.version_info.outputs.name }}</code>"
          CAPTION+=$'\n'
          CAPTION+="🔢 <b>Build #:</b> <code>${{ steps.version_info.outputs.commit_count }}</code>"
          CAPTION+=$'\n'
          CAPTION+="🔗 <b>Commit:</b> <code>${{ steps.version_info.outputs.short_sha }}</code>"
          CAPTION+=$'\n'
          CAPTION+="📅 <b>Date:</b> <code>$(date +%Y-%m-%d)</code>"
          CAPTION+=$'\n\n'
          CAPTION+="⚠️ <i>This is a nightly build. Report issues on GitHub.</i>"
          CAPTION+=$'\n\n'
          CAPTION+="<a href=\"${RUN_URL}\">🔍 View Actions Run</a>"
          if [ ! -f "${{ steps.find_apk.outputs.path }}" ]; then
            echo "❌ APK file not found at ${{ steps.find_apk.outputs.path }}"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/tg_response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${{ steps.find_apk.outputs.path }}" \
            --form-string "caption=${CAPTION}" \
            --form-string "parse_mode=HTML")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] && grep -q '"ok":true' /tmp/tg_response.json 2>/dev/null; then
            echo "✅ Telegram notification sent."
          else
            echo "❌ Telegram notification failed:"
            cat /tmp/tg_response.json 2>/dev/null || echo "(empty response)"
            exit 1
          fi

      - name: Send Nightly notification to Discord
        if: success() && steps.check_version.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ Discord webhook URL not set — skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_DATE="$(date +%Y-%m-%d)"

          cat > /tmp/discord_payload.json <<EOF
          {
            "username": "Rhythm CI",
            "avatar_url": "https://github.com/cromaguy/Rhythm/raw/main/assets/icon.png",
            "embeds": [
              {
                "title": "🎵 Rhythm Nightly Build Available",
                "description": "A new nightly build has been compiled and is ready for testing.",
                "url": "${RUN_URL}",
                "color": 7340031,
                "fields": [
                  {
                    "name": "📦 Version",
                    "value": "\`${{ steps.version_info.outputs.name }}\`",
                    "inline": false
                  },
                  {
                    "name": "🔢 Build #",
                    "value": "\`${{ steps.version_info.outputs.commit_count }}\`",
                    "inline": true
                  },
                  {
                    "name": "🔗 Commit",
                    "value": "\`${{ steps.version_info.outputs.short_sha }}\`",
                    "inline": true
                  },
                  {
                    "name": "📅 Date",
                    "value": "${BUILD_DATE}",
                    "inline": true
                  },
                  {
                    "name": "📥 Download APK",
                    "value": "[Open Actions Run](${RUN_URL}) → Download from the Artifacts section",
                    "inline": false
                  },
                  {
                    "name": "⚠️ Note",
                    "value": "This is a **nightly build**. Please report any issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues).",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Rhythm CI • Nightly Channel"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF

          curl -s -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d @/tmp/discord_payload.json \
            | tee /tmp/discord_response.json \
            && echo "✅ Discord notification sent." \
            || { echo "❌ Discord notification failed:"; cat /tmp/discord_response.json; exit 1; }

      - name: Send failure notification to Telegram
        if: failure() && steps.check_version.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set — skipping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="❌ <b>Rhythm Nightly Build Failed</b>"
          MESSAGE+=$'\n\n'
          MESSAGE+="📦 <b>Version:</b> <code>${{ steps.version_info.outputs.name }}</code>"
          MESSAGE+=$'\n'
          MESSAGE+="🔗 <b>Commit:</b> <code>${{ steps.version_info.outputs.short_sha }}</code>"
          MESSAGE+=$'\n\n'
          MESSAGE+="🔴 The compilation or packaging step failed. Please check the logs."
          MESSAGE+=$'\n\n'
          MESSAGE+="<a href=\"${RUN_URL}\">🔍 View Actions Run</a>"
          
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}" \
            --form-string "parse_mode=HTML" \
            --form-string "disable_web_page_preview=true"
